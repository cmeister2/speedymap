name: Build and deploy Speedymap

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh the UK road database before publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: speedymap-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source and road snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Set up Python for a requested database refresh
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
          cache: pip

      - name: Refresh the full UK road database
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s scripts/tests -v
          python scripts/download_osm.py
          python scripts/build_graph.py \
            --input .cache/united-kingdom-latest.osm.pbf \
            --output public/data \
            --region 'United Kingdom' \
            --source-url https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf \
            --location-index sparse_file_array,.cache/node-locations.bin
          python scripts/validate_data.py public/data
          node scripts/build_default_route.mjs

      - name: Test route calculations
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Validate the UK database and published site size
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, readdir, stat } from 'node:fs/promises';
          import { resolve, sep } from 'node:path';
          import { gunzipSync } from 'node:zlib';
          import { CACHE_VERSION, DEFAULT_JOURNEY, makeRouteCacheKey, isValidRouteResult } from './src/route-cache.js';

          const dataDirectory = resolve('dist/data');
          const manifest = JSON.parse(await readFile(resolve(dataDirectory, 'manifest.json'), 'utf8'));
          assert.equal(manifest.schemaVersion, 1, 'Unsupported database format');
          assert.equal(manifest.region, 'United Kingdom', 'Deploy the complete UK road snapshot');
          assert.equal(manifest.source?.license, 'ODbL-1.0', 'Database license metadata is missing');
          assert(manifest.sourceDate, 'The road snapshot date is missing');
          for (const field of ['nodes', 'edges', 'roadCount', 'placeCount', 'graphBytes']) {
            assert(manifest[field] > 0, `Missing database count: ${field}`);
          }
          assert(manifest.nodes > 100_000 && manifest.edges > 100_000, 'The UK graph is unexpectedly small');
          assert(manifest.graphChunks?.length, 'The routing graph is missing');
          assert(manifest.geometryChunks?.length, 'The road geometry is missing');
          const dataFiles = [
            ...manifest.graphChunks.map(chunk => chunk.file),
            ...manifest.geometryChunks.map(chunk => chunk.file),
            manifest.roadsFile,
            manifest.placesFile,
            manifest.restrictionsFile,
            'LICENSE.txt',
          ];
          const sizes = new Map();
          for (const file of dataFiles) {
            assert.equal(typeof file, 'string', 'Invalid database filename');
            const path = resolve(dataDirectory, file);
            assert(path.startsWith(dataDirectory + sep), 'Database filename must remain in data/');
            const info = await stat(path);
            assert(info.isFile() && info.size > 0, `Missing or empty database file: ${file}`);
            sizes.set(file, info.size);
          }
          for (const chunk of [...manifest.graphChunks, ...manifest.geometryChunks]) {
            assert.equal(sizes.get(chunk.file), chunk.compressedBytes, `Truncated database chunk: ${chunk.file}`);
          }
          let graphBytes = 0;
          for (const chunk of manifest.graphChunks) {
            assert.equal(chunk.byteOffset, graphBytes, 'Routing graph chunks must be contiguous');
            graphBytes += chunk.byteLength;
          }
          assert.equal(graphBytes, manifest.graphBytes, 'Routing graph size differs from the manifest');
          assert.equal(manifest.geometryChunks.reduce((count, chunk) => count + chunk.count, 0), manifest.geometries, 'Road geometry count differs from the manifest');
          assert.equal(dataFiles.filter(file => file !== 'LICENSE.txt').reduce((bytes, file) => bytes + sizes.get(file), 0), manifest.totalCompressedBytes, 'Database size differs from the manifest');

          const defaultJourney = JSON.parse(gunzipSync(await readFile(resolve('dist/default-route.json.gz'))).toString('utf8'));
          assert.equal(defaultJourney.cacheVersion, CACHE_VERSION, 'Rebuild the default journey after changing the routing cache version');
          assert.equal(defaultJourney.key, makeRouteCacheKey(manifest, DEFAULT_JOURNEY), 'The default journey belongs to a different road snapshot or request');
          assert.deepEqual(defaultJourney.journey, DEFAULT_JOURNEY, 'The bundled journey must use the default endpoints and speed mode');
          assert.equal(defaultJourney.sourceDate, manifest.sourceDate, 'The default journey source date differs from the road snapshot');
          assert(isValidRouteResult(defaultJourney.result, DEFAULT_JOURNEY), 'The bundled default route or comparison is invalid');

          let totalBytes = 0;
          let fileCount = 0;
          async function inspect(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = resolve(directory, entry.name);
              assert(!entry.isSymbolicLink(), `Pages artifacts cannot contain symlinks: ${path}`);
              if (entry.isDirectory()) {
                await inspect(path);
              } else {
                const { size } = await stat(path);
                assert(size < 100 * 1024 ** 2, `File exceeds the 100 MiB project limit: ${path}`);
                totalBytes += size;
                fileCount++;
              }
            }
          }
          await inspect(resolve('dist'));
          assert(totalBytes < 1_000_000_000, 'Published site exceeds the 1 GB GitHub Pages limit');
          console.log(`Verified ${fileCount} files, ${(totalBytes / 1024 ** 2).toFixed(1)} MiB; ${manifest.nodes.toLocaleString()} nodes and ${manifest.edges.toLocaleString()} directed edges.`);
          JS

      - name: Upload static Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  success:
    name: Success
    if: ${{ always() }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify build and deployment results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOY_REQUIRED: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          test "$BUILD_RESULT" = "success"
          if [ "$DEPLOY_REQUIRED" = "true" ]; then
            test "$DEPLOY_RESULT" = "success"
          else
            test "$DEPLOY_RESULT" = "skipped"
          fi
